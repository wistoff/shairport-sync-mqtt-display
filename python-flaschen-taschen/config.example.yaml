---
mqtt:
  topic: 'shairport-sync/SS_HOSTNAME'  # there should NOT be a leading slash!
  host: raspimqtt  # a resolvable hostname (e.g. /etc/host entry)
  port: 1883
  username: null
  password: null
  use_tls: false
  tls:
    ca_certs_path: null
    certfile_path: null
    keyfile_path: null
  logger: true

flaschen:
  server: localhost
  port: 1337
  led-rows: 32
  led-columns: 32

# Smooth cover, Canvas, and display-clear changes.
display:
  transition-seconds: 0.45
  transition-fps: 20

# Optional Spotify Canvas playback. The AirPlay cover is always shown first and
# remains on screen whenever no Canvas is found or any Spotify request fails.
canvas:
  mode: cover                 # "cover" (original behaviour) or "canvas"
  cookie-env: SPOTIFY_SP_DC   # keep the sp_dc cookie in the environment
  fps: 8                      # capped at 20 to protect small devices
  fit: cover                  # "cover" crops to square; "contain" adds bars
  lookup-delay: 1.0
  max-download-mb: 20

